# Prereq: GitHub Pages settings → Source = "GitHub Actions"

name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    uses: nplus-father/workflows/.github/workflows/astro-build-deploy.yml@v1
    permissions:
      contents: read
      pages: write
      id-token: write
    secrets: inherit
    with:
      # Owned by Andrewnplus, not the nplus-father org — org-level self-hosted
      # runners are not reachable from here, so stay GitHub-hosted.
      runner-labels: '["ubuntu-latest"]'
